definition_version: 2
entities:
  trace_analyzer:
    type: streamlit
    identifier:
      name: AI_GATEWAY_TRACE_ANALYZER
      database: CORTEX_GATEWAY_LAB
      schema: PUBLIC
    query_warehouse: GATEWAY_LAB_WH
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    external_access_integrations:
      - GATEWAY_LAB_APP_EAI
    # Gateway auth defaults to the container session token (served, not traced in testing).
    # Optional PAT secret: only works if your network policy allows the container egress IP.
    # secrets:
    #   gateway_pat: CORTEX_GATEWAY_LAB.PUBLIC.GATEWAY_PAT_SECRET
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - gateway_client.py
      - trace_queries.py
      - pyproject.toml
      - .streamlit/config.toml
      - app_pages/overview.py
      - app_pages/model_performance.py
      - app_pages/user_deep_dive.py
      - app_pages/trace_explorer.py
      - app_pages/advisor.py
      - app_pages/experiments.py
      - app_pages/compare.py
