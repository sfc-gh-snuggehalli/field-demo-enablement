# Local environment for the lab: notebook, Streamlit MCP client, smoke test and Snowflake CLI.
# `./demo.sh setup` runs `uv sync` against this file; commit uv.lock with it.
[project]
name = "multi-agent-mcp-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "snowflake-snowpark-python>=1.20",
    "snowflake-cli>=3.10",
    "pandas",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    # MCP client app and smoke test (JSON-RPC over httpx, key-pair JWT, Cortex Messages)
    "streamlit>=1.40",
    "anthropic>=0.40",
    "pyjwt>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
]

[tool.uv]
package = false
