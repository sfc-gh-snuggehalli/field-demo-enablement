# Local environment for the lab: five notebooks, the headless build and the Snowflake CLI.
# `./demo.sh setup` runs `uv sync` against this file; commit uv.lock with it.
# Clustering (umap-learn, hdbscan) and survival models (lifelines, scikit-survival) run inside
# Snowflake stored procedures from the Snowflake channel, so they are not installed locally.
[project]
name = "transcript-churn-ml-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "snowflake-snowpark-python>=1.20",
    "snowflake-cli>=3.10",
    "pandas",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "snowflake-ml-python==2.4.0",
    "scikit-learn==1.9.1",
    "numpy",
    "numba",
]

[tool.uv]
package = false
